[package]
name = "comicbot"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "Twitch chat bot that renders conversations as Microsoft Comic Chat style comic strips with user-supplied PNG avatars"
license = "MIT"

[dependencies]
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "net",
    "io-util",
    "time",
    "sync",
    "signal",
] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pki-types = "1"
rustls-native-certs = "0.8"
anyhow = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
fontdue = "0.8"
minifb = { version = "0.27", default-features = false, features = ["x11"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
unicode-width = "0.2"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
