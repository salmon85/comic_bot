name: Build

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-22.04
            artifact: comicbot-linux-x86_64
            binary: target/release/comicbot
          - name: Windows x86_64
            os: windows-latest
            artifact: comicbot-windows-x86_64
            binary: target/release/comicbot.exe

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache build
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.artifact }}

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/avatars dist/backgrounds
          cp "${{ matrix.binary }}" dist/
          cp README.md comicbot_example.toml dist/
          cp avatars/README.md dist/avatars/README.md
          cp backgrounds/README.md dist/backgrounds/README.md

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create release archives
        shell: bash
        run: |
          set -euo pipefail
          tar -czf comicbot-linux-x86_64.tar.gz -C release-assets/comicbot-linux-x86_64 .
          (cd release-assets/comicbot-windows-x86_64 && zip -r ../../comicbot-windows-x86_64.zip .)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            comicbot-linux-x86_64.tar.gz \
            comicbot-windows-x86_64.zip \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
